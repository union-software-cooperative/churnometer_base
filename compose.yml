# This is our production compose file - not changed for docker-sync or similar

services:
  db:
    build:
      context: .
      dockerfile: dockerfile-db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-file: "50"
        max-size: "10m"
    volumes:
      - pg18:/var/lib/postgresql/18/docker
      - $PWD/postgresql.conf:/etc/postgresql.conf
      - $PWD/scripts/db:/scripts
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - PGDATESTYLE
  www:
    build:
      context: .
      dockerfile: dockerfile-www
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "50"
        max-size: "10m"
    volumes:
      - bundle:/usr/local/bundle
      - $PWD/app:/app
    environment:
      - BUNDLE_PATH=/usr/local/bundle
      - GEM_HOME=/usr/local/bundle
      - RACK_ENV
      - CHURN_USER
      - CHURN_PASS
      - PGDATESTYLE
      - OAUTH2_CLIENT_ID
      - OAUTH2_CLIENT_SECRET
      - OAUTH2_CLIENT_REDIRECT_URI
      - OAUTH2_PROVIDER
      - LDAP_ADMIN_GROUP
      - EXPORT_CUTOFF
    links:
      - db
    command: ./docker-command
volumes:
  bundle:
  pg18:
