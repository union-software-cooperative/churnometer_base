# NOTE: default here is localhost, which does not include the Docker IP - you don't need to listen on
# all interfaces but you will need to identify your docker IP (typically in the 172.16.0.0/12 range)
# and list it here like '172.19.0.3,localhost'
listen_addresses = '*'

# Example below, but see e.g. https://pgtune.leopard.in.ua/ for a quickstart based on your environment

# DB Version: 18
# OS Type: linux
# DB Type: web
# Total Memory (RAM): 32 GB
# CPUs num: 16
# Connections num: 50
# Data Storage: ssd

max_connections = 50
shared_buffers = 8GB
effective_cache_size = 24GB
maintenance_work_mem = 2GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 127100kB
huge_pages = try
min_wal_size = 1GB
max_wal_size = 16GB
max_worker_processes = 16
max_parallel_workers_per_gather = 4
max_parallel_workers = 16
max_parallel_maintenance_workers = 4
